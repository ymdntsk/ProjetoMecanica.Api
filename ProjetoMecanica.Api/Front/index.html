<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Projeto Mecânica</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-label="Área de login">
        <div class="brand">
          <div class="brand-mark">PM</div>
          <h1>Projeto Mecânica</h1>
        </div>

        <form class="login-form" action="#" method="post">
          <label for="usuario">Usuário</label>
          <input id="usuario" name="usuario" type="text" placeholder="Digite seu usuário" />

          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" placeholder="Digite sua senha" />

          <button type="submit">Entrar</button>
        </form>
      </section>
    </main>
  </body>
</html>
