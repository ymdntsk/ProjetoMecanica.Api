<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="Styles/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body>
    <main class="Pagina-Login">
      <section class="Conteudo-Login">
          <div class="logo"><img src="Img/Logo.png" alt="Logo"></div>

        <form class="login glass-card " method="post">
          <h1>Login</h1>

          <div class="input-group">
          <label for="usuario">User</label>
          <div class="input-item">
          <i class="fa-solid fa-user"></i>
          <input id="usuario" name="usuario" type="text" placeholder="Digite seu usuário" />
          </div>
            </div>

          <div class="input-group">
            <label for="senha">Senha</label>
            <div class="input-item">
              <i class="fa-solid fa-lock"></i>
              <input id="senha" name="senha" type="password" placeholder="Digite sua senha" />
            </div>
          </div>
          
         
  <button type="button" class="btn" onclick="window.location.href='Listagem-Agendamento.html'">Entrar</button>

        </form>
      </section>
    </main>
  </body>
</html>
